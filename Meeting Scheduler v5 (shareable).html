document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

src: url(\"9e3cee9d-5900-4980-81ac-961e31c70be0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; background: #F2EDE3; color: #1A1A18; }\n  * { box-sizing: border-box; }\n  input, button, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }\n  a { color: #A8842C; }\n  a:hover { color: #1C3D2E; }\n  ::placeholder { color: #A9A39A; }\n  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }\n  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display: flex; align-items: stretch; min-height: 100vh; font-family: Inter, sans-serif; font-size: 14px; line-height: 1.5; background: #F2EDE3;\">\n\n  <aside style=\"width: 268px; flex: none; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: #1C3D2E; color: #F2EDE3; padding: 30px 0 28px; display: flex; flex-direction: column; gap: 30px;\">\n    <div style=\"padding: 0 26px;\">\n      <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.16em; text-transform: uppercase;\">C. Hoare &amp; Co.<\u002Fdiv>\n      <div style=\"margin-top: 5px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #A8842C;\">Meeting Scheduler · V5 AI<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n      <div sc-camel-on-click=\"{{ goDash }}\" style=\"{{ navDashStyle }}\">Meeting tracker<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ startWizard }}\" style=\"{{ navNewStyle }}\">Arrange a meeting<\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ inWizard }}\" hint-placeholder-val=\"{{ true }}\">\n      <nav style=\"display: flex; flex-direction: column; gap: 2px; border-top: 1px solid rgba(242,237,227,0.14); padding-top: 18px;\">\n        <sc-for list=\"{{ rail }}\" as=\"s\" hint-placeholder-count=\"11\">\n          <div sc-camel-on-click=\"{{ s.go }}\" style=\"{{ s.style }}\">\n            <div style=\"display: flex; align-items: baseline; gap: 10px;\">\n              <span style=\"{{ s.numStyle }}\">{{ s.num }}<\u002Fspan>\n              <span style=\"font-size: 13px;\">{{ s.label }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ s.sum }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-left: 26px; margin-top: 3px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14px; color: rgba(242,237,227,0.6);\">{{ s.sum }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fnav>\n    <\u002Fsc-if>\n\n    <div style=\"margin-top: auto; padding: 0 26px; display: flex; flex-direction: column; gap: 12px;\">\n      <sc-if value=\"{{ canDelegate }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"border-top: 1px solid rgba(242,237,227,0.14); padding-top: 14px;\">\n          <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #A8842C;\">Acting for<\u002Fdiv>\n          <div style=\"margin-top: 8px; display: flex; flex-direction: column; gap: 2px;\">\n            <sc-for list=\"{{ principals }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ p.pick }}\" style=\"{{ p.style }}\">\n                <div style=\"{{ p.avatarStyle }}\">{{ p.initials }}<\u002Fdiv>\n                <span>{{ p.name }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top: 8px; font-size: 11px; color: rgba(242,237,227,0.45); line-height: 1.5;\">{{ actingNote }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"border-top: 1px solid rgba(242,237,227,0.14); padding-top: 14px; display: flex; flex-direction: column; gap: 10px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(242,237,227,0.45);\">Signed in<\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 12px;\">\n          <div style=\"{{ signedInAvatarStyle }}\">{{ signedInInitials }}<\u002Fdiv>\n          <div>\n            <div style=\"font-size: 13px; color: #F2EDE3;\">{{ signedInName }}<\u002Fdiv>\n            <div style=\"margin-top: 2px; font-size: 11px; color: rgba(242,237,227,0.55);\">{{ signedInRole }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"flex: 1; min-width: 0; display: flex; flex-direction: column;\">\n\n    <sc-if value=\"{{ isDash }}\" hint-placeholder-val=\"{{ true }}\">\n      <section style=\"animation: fade 220ms ease both; padding: 40px 48px 64px; display: flex; flex-direction: column; gap: 28px;\">\n        <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;\">\n          <div>\n            <div style=\"font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #A8842C;\">{{ dashEyebrow }}<\u002Fdiv>\n            <h1 style=\"margin: 8px 0 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 38px; line-height: 1.1;\">{{ dashTitle }}<\u002Fh1>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ startWizard }}\" style=\"padding: 13px 26px; background: #1C3D2E; color: #F2EDE3; border-radius: 4px; font-size: 13px; cursor: pointer;\" style-hover=\"background: #16321f;\">Arrange a meeting<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;\">\n          <sc-for list=\"{{ metrics }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <div sc-camel-on-click=\"{{ m.pick }}\" style=\"{{ m.style }}\">\n              <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 40px; line-height: 1;\">{{ m.n }}<\u002Fdiv>\n              <div style=\"margin-top: 8px; font-size: 12px; color: #8A8478;\">{{ m.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;\">\n          <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap;\">\n            <sc-if value=\"{{ bankerFilterVisible }}\" hint-placeholder-val=\"{{ true }}\">\n              <sc-for list=\"{{ bankerChips }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-click=\"{{ b.pick }}\" style=\"{{ b.style }}\">{{ b.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 10px;\">\n            <input value=\"{{ dashQuery }}\" sc-camel-on-change=\"{{ onDashQuery }}\" placeholder=\"Search customer or reference\" style=\"padding: 9px 12px; width: 230px; border: 1px solid rgba(138,132,120,0.45); border-radius: 4px; background: #FAF8F4; outline: none;\" style-focus=\"border-color: #1C3D2E;\">\n            <div style=\"display: flex; border: 1px solid rgba(138,132,120,0.45); border-radius: 4px; overflow: hidden;\">\n              <div sc-camel-on-click=\"{{ viewList }}\" style=\"{{ viewListStyle }}\">List<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ viewCal }}\" style=\"{{ viewCalStyle }}\">Calendar<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ dashLoading }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background: #FAF8F4; border: 1px solid rgba(138,132,120,0.3); border-radius: 4px; padding: 22px; display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"font-size: 12px; color: #8A8478;\">Loading your meetings…<\u002Fdiv>\n            <sc-for list=\"{{ skeletonRows }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"{{ k.style }}\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isList }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background: #FAF8F4; border: 1px solid rgba(138,132,120,0.3); border-radius: 4px;\">\n            <div style=\"display: flex; gap: 16px; padding: 12px 22px; border-bottom: 1px solid rgba(138,132,120,0.28); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8478;\">\n              <div style=\"flex: 1;\">Meeting<\u002Fdiv>\n              <div style=\"width: 180px;\">Where<\u002Fdiv>\n              <sc-if value=\"{{ showBankerCol }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"width: 130px;\">Banker<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"width: 240px;\">Status<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"6\">\n              <div sc-camel-on-click=\"{{ r.open }}\" style=\"display: flex; align-items: center; gap: 16px; padding: 16px 22px; border-bottom: 1px solid rgba(138,132,120,0.15); cursor: pointer;\" style-hover=\"background: rgba(168,132,44,0.06)\">\n                <div style=\"flex: 1;\">\n                  <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 21px;\">{{ r.client }}<\u002Fdiv>\n                  <div style=\"margin-top: 2px; font-size: 12px; color: #8A8478;\">{{ r.meta }}<\u002Fdiv>\n                  <sc-if value=\"{{ r.reason }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"margin-top: 3px; font-size: 12px; color: #8A6A18;\">{{ r.reason }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"{{ r.whereStyle }}\">{{ r.where }}<\u002Fdiv>\n                <sc-if value=\"{{ showBankerCol }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"width: 130px; font-size: 13px; color: #55504a;\">{{ r.banker }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"width: 240px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;\">\n                  <span style=\"{{ r.badgeStyle }}\">{{ r.status }}<\u002Fspan>\n                  <sc-for list=\"{{ r.actions }}\" as=\"a\" hint-placeholder-count=\"2\">\n                    <div sc-camel-on-click=\"{{ a.act }}\" style=\"{{ a.style }}\">{{ a.label }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ emptyRows }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"padding: 40px 22px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px;\">\n                <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: #8A8478;\">Nothing matches those filters.<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ clearFilters }}\" style=\"font-size: 13px; color: #1C3D2E; text-decoration: underline; cursor: pointer;\">Clear filters<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ pagerVisible }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"padding: 13px 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px;\">\n                <div style=\"font-size: 12px; color: #8A8478;\">{{ pageLabel }}<\u002Fdiv>\n                <div style=\"display: flex; gap: 8px;\">\n                  <div sc-camel-on-click=\"{{ pagePrev }}\" style=\"{{ pagePrevStyle }}\">Previous<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ pageNext }}\" style=\"{{ pageNextStyle }}\">Next<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isCal }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px;\">\n              <div style=\"display: flex; align-items: center; gap: 14px;\">\n                <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 24px;\">{{ calLabel }}<\u002Fdiv>\n                <div style=\"display: flex; gap: 8px;\">\n                  <div sc-camel-on-click=\"{{ calPrev }}\" style=\"{{ calPrevStyle }}\">Previous week<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ calNext }}\" style=\"{{ calNextStyle }}\">Next week<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ toggleProposals }}\" style=\"display: flex; align-items: center; gap: 10px; cursor: pointer;\">\n                <div style=\"{{ proposalToggleStyle }}\"><\u002Fdiv>\n                <div style=\"font-size: 12px; color: #55504a;\">Show proposed slots awaiting selection<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;\">\n              <sc-for list=\"{{ calHeads }}\" as=\"h\" hint-placeholder-count=\"5\">\n                <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8478; padding-bottom: 2px;\">{{ h.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ calCells }}\" as=\"c\" hint-placeholder-count=\"20\">\n                <div sc-camel-on-click=\"{{ c.pick }}\" style=\"{{ c.style }}\">\n                  <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 8px;\">\n                    <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 20px; color: #40403c;\">{{ c.dom }}<\u002Fdiv>\n                    <div style=\"font-size: 10px; color: #8A8478;\">{{ c.city }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"{{ c.bandStyle }}\"><\u002Fdiv>\n                  <div style=\"margin-top: 6px; display: flex; flex-direction: column; gap: 4px;\">\n                    <sc-for list=\"{{ c.items }}\" as=\"i\" hint-placeholder-count=\"1\">\n                      <div style=\"{{ i.style }}\">{{ i.label }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 22px; font-size: 11px; color: #8A8478;\">\n              <span>Solid — confirmed<\u002Fspan>\n              <span>Hatched — proposed, awaiting customer<\u002Fspan>\n              <span>Faint — your other Outlook commitments<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ inWizard }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"animation: fade 200ms ease both; display: flex; flex-direction: column;\">\n        <div style=\"border-bottom: 1px solid rgba(138,132,120,0.4); background: #FAF8F4; padding: 16px 48px; display: flex; align-items: center; gap: 34px; flex-wrap: wrap;\">\n          <sc-if value=\"{{ noClient }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size: 12px; color: #8A8478;\">Customer context appears here once a customer is chosen. Booking-relevant fields only.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasClient }}\" hint-placeholder-val=\"{{ true }}\">\n            <sc-for list=\"{{ strip }}\" as=\"f\" hint-placeholder-count=\"5\">\n              <div>\n                <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8478;\">{{ f.label }}<\u002Fdiv>\n                <div style=\"{{ f.valueStyle }}\">{{ f.value }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"padding: 34px 48px 72px; display: flex; flex-direction: column; gap: 34px;\">\n          <sc-if value=\"{{ isGuided }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #A8842C;\">{{ guidedEyebrow }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isPropose }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background: #FBF3E0; border: 1.5px solid #A8842C; border-radius: 4px; padding: 18px 20px; max-width: 940px; display: flex; align-items: center; justify-content: space-between; gap: 20px;\">\n              <div>\n                <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 20px; line-height: 1.35;\">{{ proposeTitle }}<\u002Fdiv>\n                <div style=\"margin-top: 4px; font-size: 12px; color: #6F6A60;\">{{ proposeNote }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ proposeLocked }}\" hint-placeholder-val=\"{{ true }}\">\n                <div sc-camel-on-click=\"{{ proposeUnlock }}\" style=\"flex: none; padding: 9px 16px; border: 1px solid #1C3D2E; border-radius: 4px; font-size: 12px; color: #1C3D2E; cursor: pointer; white-space: nowrap;\" style-hover=\"background: #1C3D2E; color: #FAF8F4;\">Change the locked details<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ sClient }}\" hint-placeholder-val=\"{{ true }}\">\n            <section style=\"display: flex; flex-direction: column; gap: 18px; max-width: 720px;\">\n              <div>\n                <h2 style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 34px; line-height: 1.1;\">Who is the meeting for?<\u002Fh2>\n                <p style=\"margin: 6px 0 0; color: #8A8478;\">Search by name, initials or customer reference — or start from the customer's email.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"background: #FAF8F4; border: 1px solid rgba(138,132,120,0.3); border-radius: 4px; padding: 22px; display: flex; flex-direction: column; gap: 12px;\">\n                <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;\">\n                  <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #A8842C;\">Start from the customer's email — AI<\u002Fdiv>\n                  <div style=\"font-size: 11px; color: #8A8478;\">Reads intent only. You review everything it sets; nothing books.<\u002Fdiv>\n                <\u002Fdiv>\n                <textarea value=\"{{ aiPaste }}\" sc-camel-on-change=\"{{ onAiPaste }}\" rows=\"4\" placeholder=\"Paste the customer's email here…\" style=\"width: 100%; padding: 12px 14px; border: 1px solid rgba(138,132,120,0.45); border-radius: 4px; background: #FFFFFF; outline: none; resize: vertical; font-family: inherit; font-size: 13px; line-height: 1.5;\" style-focus=\"border-color: #1C3D2E;\"><\u002Ftextarea>\n                <div style=\"display: flex; align-items: center; gap: 14px; flex-wrap: wrap;\">\n                  <div sc-camel-on-click=\"{{ aiGo }}\" style=\"{{ aiGoStyle }}\">{{ aiGoLabel }}<\u002Fdiv>\n                  <label style=\"font-size: 12px; color: #1C3D2E; text-decoration: underline; cursor: pointer;\">\n                    Attach an email file (.eml or .txt)\n                    <input type=\"file\" accept=\".eml,.txt,text/plain,message/rfc822\" sc-camel-on-change=\"{{ onAiFile }}\" style=\"display: none;\">\n                  <\u002Flabel>\n                  <sc-if value=\"{{ aiFileName }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"font-size: 11px; color: #8A8478;\">{{ aiFileName }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ aiError }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"font-size: 12px; color: #8A6A18;\">{{ aiError }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ aiHasReadout }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"border-top: 1px solid rgba(138,132,120,0.25); padding-top: 12px; display: flex; flex-direction: column; gap: 8px;\">\n                    <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8478;\">What the AI read — check each line<\u002Fdiv>\n                    <sc-for list=\"{{ aiReadout }}\" as=\"a\" hint-placeholder-count=\"4\">\n                      <div style=\"display: flex; gap: 12px; align-items: baseline; font-size: 13px; color: #55504a;\">\n                        <span style=\"width: 5px; height: 5px; border-radius: 50%; background: #A8842C; flex: none;\"><\u002Fspan>\n                        <span>{{ a.label }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"background: #FAF8F4; border: 1px solid rgba(138,132,120,0.3); border-radius: 4px; padding: 22px;\">\n                <input value=\"{{ clientQuery }}\" sc-camel-on-change=\"{{ onClientQuery }}\" placeholder=\"e.g. Okonkwo, or CH-40218\" style=\"width: 100%; padding: 12px 14px; border: 1px solid rgba(138,132,120,0.45); border-radius: 4px; background: #FFFFFF; outline: none;\" style-focus=\"border-color: #1C3D2E;\">\n                <div style=\"margin-top: 12px; display: flex; flex-direction: column; gap: 6px;\">\n                  <sc-for list=\"{{ clientResults }}\" as=\"c\" hint-placeholder-count=\"4\">\n                    <div sc-camel-on-click=\"{{ c.pick }}\" style=\"{{ c.style }}\">\n                      <div>\n                        <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 20px;\">{{ c.name }}<\u002Fdiv>\n                        <div style=\"margin-top: 2px; font-size: 12px; color: #8A8478;\">{{ c.meta }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"{{ c.flagStyle }}\">{{ c.flag }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ crmLine }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-size: 12px; color: #8A8478;\">{{ crmLine }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ sType }}\" hint-placeholder-val=\"{{ true }}\">\n            <section style=\"display: flex; flex-direction: column; gap: 18px; max-width: 860px;\">\n              <div>\n                <h2 style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 34px; line-height: 1.1;\">What kind of meeting, and in what format?<\u002Fh2>\n                <p style=\"margin: 6px 0 0; color: #8A8478;\">The type sets a default length, which you can change. Format governs which later steps appear.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 10px;\">\n                <sc-for list=\"{{ formats }}\" as=\"f\" hint-placeholder-count=\"3\">\n                  <div sc-camel-on-click=\"{{ f.pick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"background: #FAF8F4; border: 1px solid rgba(138,132,120,0.3); border-radius: 4px; padding: 8px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px;\">\n                <sc-for list=\"{{ types }}\" as=\"t\" hint-placeholder-count=\"16\">\n                  <div sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.style }}\">\n                    <span style=\"font-size: 13px;\">{{ t.name }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for> v>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ locIsPremises }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display: flex; gap: 10px;\">\n                  <sc-for list=\"{{ buildings }}\" as=\"b\" hint-placeholder-count=\"2\">\n                    <div sc-camel-on-click=\"{{ b.pick }}\" style=\"{{ b.style }}\">\n                      <div style=\"font-size: 13px;\">{{ b.name }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ locIsPinned }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"background: #FAF8F4; border: 1px solid rgba(138,132,120,0.3); border-radius: 4px; padding: 22px; display: flex; flex-direction: column; gap: 14px;\">\n                  <input value=\"{{ placeQuery }}\" sc-camel-on-change=\"{{ onPlaceQuery }}\" placeholder=\"Or search another place — hotel, club, office, residence\" style=\"width: 100%; padding: 11px 14px; border: 1px solid rgba(138,132,120,0.45); border-radius: 4px; background: #FFFFFF; outline: none;\" style-focus=\"border-color: #1C3D2E;\">\n                  <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n                    <sc-for list=\"{{ places }}\" as=\"p\" hint-placeholder-count=\"3\">\n                      <div sc-camel-on-click=\"{{ p.pick }}\" style=\"{{ p.style }}\">\n                        <div>\n                          <div style=\"{{ p.sourceStyle }}\">{{ p.source }}<\u002Fdiv>\n                          <div style=\"margin-top: 3px; font-family: 'Cormorant Garamond', serif; font-size: 19px;\">{{ p.name }}<\u002Fdiv>\n                          <div style=\"margin-top: 2px; font-size: 12px; color: #8A8478;\">{{ p.addr }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ pinnedChosen }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"border-top: 1px solid rgba(138,132,120,0.25); padding-top: 14px; display: flex; flex-direction: column; gap: 5px;\">\n                      <div style=\"font-size: 12px; color: #55504a; line-height: 1.6;\">{{ pinnedSummary }}<\u002Fdiv>\n                      <div style=\"font-size: 12px; color: #A8842C; line-height: 1.5;\">{{ pinnedSource }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ locIsTbc }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"background: #FBF3E0; border: 1.5px solid #A8842C; border-radius: 4px; padding: 18px 20px; max-width: 580px;\">\n                  <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px;\">The email goes out without a location.<\u002Fdiv>\n                  <div style=\"margin-top: 6px; font-size: 13px; color: #6F6A60;\">A note says the venue follows. The meeting card carries an \"Add location\" action until you do.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ sAttendees }}\" hint-placeholder-val=\"{{ true }}\">\n            <section style=\"display: flex; flex-direction: column; gap: 18px; max-width: 820px;\">\n              <div>\n                <h2 style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 34px; line-height: 1.1;\">Who is coming from the bank?<\u002Fh2>\n                <p style=\"margin: 6px 0 0; color: #8A8478;\">Diaries are read when we look for times, not here.<\u002Fp>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hasStakeholders }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"background: #FAF8F4; border: 1px             <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ sGuests }}\" hint-placeholder-val=\"{{ true }}\">\n            <section style=\"display: flex; flex-direction: column; gap: 18px; max-width: 820px;\">\n              <div>\n                <h2 style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 34px; line-height: 1.1;\">Who is coming with the customer?<\u002Fh2>\n                <p style=\"margin: 6px 0 0; color: #8A8478;\">We have no visibility of guest diaries. Related parties come from Dynamics as names only.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"background: #FAF8F4; border: 1px solid rgba(138,132,120,0.3); border-radius: 4px;\">\n                <sc-for list=\"{{ guestList }}\" as=\"g\" hint-placeholder-count=\"3\">\n                  <div sc-camel-on-click=\"{{ g.toggle }}\" style=\"{{ g.style }}\">\n                    <div>\n                      <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 19px;\">{{ g.name }}<\u002Fdiv>\n                      <div style=\"margin-top: 2px; font-size: 12px; color: #8A8478;\">{{ g.meta }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"{{ g.actionStyle }}\">{{ g.action }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size: 12px; color: #8A8478;\">{{ partySizeLine }}<\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ sCatering }}\" hint-placeholder-val=\"{{ true }}\">\n            <section style=\"display: flex; flex-direction: column; gap: 18px; max-width: 820px;\">\n              <div>\n                <h2 style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 34px; line-height: 1.1;\">Refreshments?<\u002Fh2>\n                <p style=\"margin: 6px 0 0; color: #8A8478;\">This is the requirement automation books the room against — coffee needs a side surface, lunch needs covers.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;\">\n                <sc-for list=\"{{ cateringOptions }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <div sc-camel-on-click=\"{{ c.pick }}\" style=\"{{ c.style }}\">\n                    <div style=\"font-size: 13px;\">{{ c.label }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ cateringClash }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"background: #FBF3E0; border: 1.5px solid #A8842C; border-radius: 4px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; max-width: 620px;\">\n                  <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 20px; line-height: 1.35;\">{{ cateringClash }}<\u002Fdiv>\n                  <div style=\"display: flex; gap: 10px;\">\n                    <div sc-camel-on-click=\"{{ extendMeeting }}\" style=\"padding: 9px 16px; border: 1px solid #1C3D2E; border-radius: 4px; font-size: 12px; color: #1C3D2E; cursor: pointer;\" style-hover=\"background: #1C3D2E; color: #FAF8F4;\">{{ extendLabel }}<\u002Fdiv>\n                    <div sc-camel-on-click=\"{{ trimCatering }}\" style=\"padding: 9px 16px; border: 1px solid rgba(28,61,46,0.4); border-radius: 4px; font-size: 12px; color: #1C3D2E; cursor: pointer;\" style-hover=\"border-color: #1C3D2E;\">Trim the catering<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"background: #FAF8F4; border: 1px solid rgba(138,132,120,0.3); border-radius: 4px; padding: 18px 22px; display: flex; align-items: center; gap: 22px;\">\n                <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8478;\">Covers<\u002Fdiv>\n                <div nfirmation. This is what will happen.' : '',\n      cancelStep1: !s.cancelDone && s.cancelStep === 1, cancelStep2: !s.cancelDone && s.cancelStep === 2,\n      cancelStep3: !s.cancelDone && s.cancelStep === 3, cancelStep4: !s.cancelDone && s.cancelStep === 4, cancelDone: s.cancelDone,\n      cancelReasons: ['Customer request', 'Banker diary conflict', 'Rescheduling', 'Other'].map(r => ({\n        label: r, note: r === 'Rescheduling' ? 'Takes you straight into the reschedule flow' : '',\n        pick: () => { if (r === 'Rescheduling') { this.startWizard(); return; } this.setState({ cancelReason: r }); },\n        style: this.row(s.cancelReason === r, { padding: '14px 16px' })\n      })),\n      cancelRecipients: cancelRecipients, cancelEffects: cancelEffects,\n      cancelMessage: s.cancelMessage, onCancelMessage: e => this.setState({ cancelMessage: e.target.value }),\n      cancelCta: s.cancelDone ? 'Back to the meeting tracker' : s.cancelStep === 4 ? 'Cancel the meeting' : 'Continue',\n      cancelCtaStyle: { padding: '13px 26px', borderRadius: '4px', fontSize: '13px', cursor: 'pointer', background: '#1C3D2E', color: '#F2EDE3' },\n      cancelNext: () => {\n        if (s.cancelDone) { this.setState({ screen: 'dash' }); return; }\n        if (s.cancelStep < 4) { this.setState({ cancelStep: s.cancelStep + 1 }); return; }\n        this.setState({ cancelDone: true, meetings: s.meetings.map(m => m.id === s.cancelId ? Object.assign({}, m, { status: 'Cancelled', reason: '', updated: 'Just now' }) : m) });\n      },\n      cancelBackVisible: !s.cancelDone && s.cancelStep > 1, cancelBack: () => this.setState({ cancelStep: Math.max(1, s.cancelStep - 1) }),\n      cancelTones: ['Formal', 'Warm', 'Concise'].map(t => ({ label: t, pick: () => this.setState({ cancelTone: t }), style: this.opt(s.cancelTone === t, { padding: '6px 14px', fontSize: '12px' }) })),\n      cancelDraftGo: () => this.aiCancelDraft(),\n      cancelDraftLabel: s.cancelDraftBusy ? 'Drafting…' : 'Draft with AI',\n      cancelDraftStyle: { padding: '7px 16px', border: '1px solid #1C3D2E', borderRadius: '4px', fontSize: '12px', color: '#1C3D2E', cursor: s.cancelDraftBusy ? 'wait' : 'pointer', whiteSpace: 'nowrap' },\n      cancelDraftError: s.cancelDraftError,\n      closeCancel: () => this.guard(() => this.setState({ screen: 'detail' }))\n    };\n  }\n}\n\n\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
